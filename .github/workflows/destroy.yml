name: Destroy (dev)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY (maiúsculas) para confirmar'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: "true"

jobs:
  destroy:
    name: Destroy
    if: inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev/landing-zone.tfstate"

      - name: terraform plan -destroy
        run: |
          terraform plan -destroy -input=false -no-color -out=tfdestroy
          {
            echo "## Terraform Destroy — dev"
            echo '```'
            terraform show -no-color tfdestroy
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform destroy
        run: terraform apply -input=false -auto-approve tfdestroy