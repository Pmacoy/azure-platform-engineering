apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        # O UID PRECISA ser numérico aqui, e isto custou um deploy quebrado.
        #
        # `runAsNonRoot: true` é uma promessa que o kubelet tem que VERIFICAR
        # antes de iniciar o container. Se a imagem declara `USER nonroot`
        # (um nome), ele precisaria abrir a imagem e resolver esse nome no
        # /etc/passwd dela para descobrir o UID -- e numa imagem distroless
        # não há o que resolver. Sem conseguir provar que o usuário não é
        # root, ele recusa e o pod fica em CreateContainerConfigError, sem
        # nunca ter tentado rodar a imagem.
        #
        # 65532 é o UID do usuário `nonroot` nas imagens distroless do Google.
        # Declarar o número aqui torna a verificação possível sem o kubelet
        # precisar inspecionar nada.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          # Placeholder. O kustomization.yaml ao lado reescreve isto para o
          # endereço real do ACR mais a tag do commit -- e é aquele arquivo
          # que o pipeline edita a cada build. O manifesto em si nunca muda.
          image: demo-api
          ports:
            - name: http
              containerPort: 8080
          # Requests são o que o scheduler usa para decidir onde o pod cabe;
          # limits são o teto antes do kernel matar o processo (memória) ou
          # estrangulá-lo (CPU). Num cluster de um nó pequeno, requests
          # honestos e baixos são a diferença entre o pod agendar e ficar
          # eternamente em Pending.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
      # Espalha as réplicas entre nós quando houver mais de um. Com um nó só
      # ele não tem efeito, mas "ScheduleAnyway" garante que isso seja uma
      # preferência e não um bloqueio -- com "DoNotSchedule" a segunda réplica
      # ficaria Pending para sempre no cluster atual.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-api
